name: Build and Release RocketSizer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ai-dev-tools for linter
        uses: actions/checkout@v4
        with:
          repository: DontKwo/ai-dev-tools
          path: .toolchain/ai-dev-tools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run ClaudeMD Strict Linter
        run: uv run --no-project python .toolchain/ai-dev-tools/scripts/claudemd_linter.py . --level strict --full

      - name: Display Lint Report on Failure
        if: failure()
        run: |
          find .toolchain/ai-dev-tools/scripts/ -name "lint_report_*.txt" -exec cat {} + || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify TypeScript compilation
        run: |
          cd src
          npm ci || npm install
          npx tsc --noEmit

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run aerospace verification benchmark suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release desktop executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop

      - name: Stage Windows binary
        run: Copy-Item src-tauri/target/release/rocket_sizer_desktop.exe RocketSizer-windows-x86_64.exe

      - name: Verify executable self-test
        run: .\RocketSizer-windows-x86_64.exe --self-test

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketSizer-windows-x86_64
          path: RocketSizer-windows-x86_64.exe
          retention-days: 14

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run aerospace verification benchmark suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release desktop executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop --target x86_64-unknown-linux-gnu

      - name: Stage Linux binary
        run: |
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/rocket_sizer_desktop RocketSizer-linux-x86_64
          chmod +x RocketSizer-linux-x86_64

      - name: Verify executable self-test
        run: ./RocketSizer-linux-x86_64 --self-test

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketSizer-linux-x86_64
          path: RocketSizer-linux-x86_64
          retention-days: 14

  build-macos:
    name: Build macOS Universal & Per-Arch
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Apple Silicon and Intel targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run aerospace verification benchmark suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Apple Silicon release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop --target aarch64-apple-darwin

      - name: Build Intel x86_64 release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop --target x86_64-apple-darwin

      - name: Assemble Universal and standalone macOS binaries
        run: |
          cp src-tauri/target/aarch64-apple-darwin/release/rocket_sizer_desktop RocketSizer-macos-aarch64
          cp src-tauri/target/x86_64-apple-darwin/release/rocket_sizer_desktop RocketSizer-macos-x86_64
          lipo -create -output RocketSizer-macos-universal RocketSizer-macos-aarch64 RocketSizer-macos-x86_64
          chmod +x RocketSizer-macos-universal RocketSizer-macos-aarch64 RocketSizer-macos-x86_64

      - name: Verify executable self-test
        run: ./RocketSizer-macos-universal --self-test

      - name: Upload macOS Universal binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketSizer-macos-universal
          path: RocketSizer-macos-universal
          retention-days: 14

      - name: Upload macOS Apple Silicon binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketSizer-macos-aarch64
          path: RocketSizer-macos-aarch64
          retention-days: 14

      - name: Upload macOS Intel binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketSizer-macos-x86_64
          path: RocketSizer-macos-x86_64
          retention-days: 14

  publish-releases:
    name: Publish Cross-Platform GitHub Release
    needs: [validate, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: RocketSizer-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          chmod +x RocketSizer-linux-x86_64 RocketSizer-macos-universal RocketSizer-macos-aarch64 RocketSizer-macos-x86_64 || true
          sha256sum RocketSizer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Move rolling latest tag on branch push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin refs/tags/latest

      - name: Update rolling latest GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RocketSizer Latest Build (main)
          body: |
            Automated multiplatform standalone desktop release built from commit `${{ github.sha }}`.
            
            ### Cross-Platform Executables
            - **Windows (x86_64)**: [RocketSizer-windows-x86_64.exe](https://github.com/DontKwo/rocket_sizer/releases/download/latest/RocketSizer-windows-x86_64.exe)
            - **Linux (x86_64)**: [RocketSizer-linux-x86_64](https://github.com/DontKwo/rocket_sizer/releases/download/latest/RocketSizer-linux-x86_64)
            - **macOS Universal (Apple Silicon & Intel)**: [RocketSizer-macos-universal](https://github.com/DontKwo/rocket_sizer/releases/download/latest/RocketSizer-macos-universal)
            - **macOS Apple Silicon (M1/M2/M3/M4)**: [RocketSizer-macos-aarch64](https://github.com/DontKwo/rocket_sizer/releases/download/latest/RocketSizer-macos-aarch64)
            - **macOS Intel (x86_64)**: [RocketSizer-macos-x86_64](https://github.com/DontKwo/rocket_sizer/releases/download/latest/RocketSizer-macos-x86_64)

            ### Launch Instructions
            - **Windows**: Double-click `RocketSizer-windows-x86_64.exe` (or `RocketSizer.exe`).
            - **Linux**: Run `chmod +x RocketSizer-linux-x86_64 && ./RocketSizer-linux-x86_64`.
            - **macOS**: Run `chmod +x RocketSizer-macos-universal && ./RocketSizer-macos-universal`.
            
            SHA256 checksums are verified and recorded in `SHA256SUMS.txt`.
          files: release-assets/*
          prerelease: false
          make_latest: true

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RocketSizer ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Official cross-platform standalone release for RocketSizer ${{ github.ref_name }}.
            
            ### Cross-Platform Executables
            - **Windows (x86_64)**: `RocketSizer-windows-x86_64.exe`
            - **Linux (x86_64)**: `RocketSizer-linux-x86_64`
            - **macOS Universal (Apple Silicon & Intel)**: `RocketSizer-macos-universal`
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `RocketSizer-macos-aarch64`
            - **macOS Intel (x86_64)**: `RocketSizer-macos-x86_64`

            ### Launch Instructions
            - **Windows**: Double-click `RocketSizer-windows-x86_64.exe`.
            - **Linux**: Run `chmod +x RocketSizer-linux-x86_64 && ./RocketSizer-linux-x86_64`.
            - **macOS**: Run `chmod +x RocketSizer-macos-universal && ./RocketSizer-macos-universal`.

            SHA256 checksums are verified and recorded in `SHA256SUMS.txt`.
          files: release-assets/*
          make_latest: true

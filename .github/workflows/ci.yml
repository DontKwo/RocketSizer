name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RocketSizer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: TypeScript Verification
        run: |
          cd src
          npm ci || npm install
          npx tsc --noEmit

      - name: Run Strict Linter and Link Check
        shell: bash
        run: |
          if ! uv run --no-project python "${{ runner.temp }}/_aitools/scripts/claudemd_linter.py" . --level strict --full --no-cache; then
            cat "${{ runner.temp }}/_aitools/scripts"/lint_report_*.txt || true
            exit 1
          fi
          uv run --no-project python "${{ runner.temp }}/_aitools/scripts/link_checker.py" .

      - name: Compute Next SemVer Release Version
        id: ver
        shell: python
        run: |
          import os, re, subprocess
          ref = os.environ.get("GITHUB_REF", "")
          tag_match = re.match(r"^refs/tags/v(\d+\.\d+\.\d+)$", ref.strip())
          if tag_match:
              ver_str = tag_match.group(1)
          else:
              subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
              raw_tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
              semvers = []
              for t in raw_tags:
                  m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", t.strip())
                  if m:
                      semvers.append(tuple(int(x) for x in m.groups()))
              base = max(semvers) if semvers else (0, 1, 0)
              next_ver = (base[0], base[1], base[2] + 1) if f"v{base[0]}.{base[1]}.{base[2]}" in raw_tags else base
              ver_str = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={ver_str}\ntag=v{ver_str}\n")
          print(f"Resolved version v{ver_str}")
    outputs:
      tag: ${{ steps.ver.outputs.tag }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust Core Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and Self-Test Windows Binary
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop
          Copy-Item src-tauri/target/release/rocket_sizer_desktop.exe RocketSizer-Windows.exe
          .\RocketSizer-Windows.exe --self-test

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: RocketSizer-Windows.exe

  build-macos:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust Core Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Universal macOS Zip and Self-Test
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop --target aarch64-apple-darwin
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop --target x86_64-apple-darwin
          lipo -create -output RocketSizer \
            src-tauri/target/aarch64-apple-darwin/release/rocket_sizer_desktop \
            src-tauri/target/x86_64-apple-darwin/release/rocket_sizer_desktop
          chmod +x RocketSizer
          ./RocketSizer --self-test
          zip -r RocketSizer-macOS.zip RocketSizer

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: RocketSizer-macOS.zip

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust Core Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux Tarball and Self-Test
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin rocket_sizer_desktop
          cp src-tauri/target/release/rocket_sizer_desktop RocketSizer-Linux
          chmod +x RocketSizer-Linux
          ./RocketSizer-Linux --self-test
          tar -czf RocketSizer-Linux.tar.gz RocketSizer-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: RocketSizer-Linux.tar.gz

  release:
    needs: [lint-and-test, build-windows, build-macos, build-linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p dist-release
          cp artifacts/windows-package/RocketSizer-Windows.exe dist-release/
          cp artifacts/macos-package/RocketSizer-macOS.zip dist-release/
          cp artifacts/linux-package/RocketSizer-Linux.tar.gz dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.lint-and-test.outputs.tag }}
          name: RocketSizer ${{ needs.lint-and-test.outputs.tag }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist-release/RocketSizer-Windows.exe
            dist-release/RocketSizer-macOS.zip
            dist-release/RocketSizer-Linux.tar.gz

  update-screenshots:
    name: Refresh Out-of-Sync Screenshots
    needs: [lint-and-test, build-linux]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Linux Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: /tmp/rs-bin

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Capture and Sync Screenshots
        run: |
          tar -xzf /tmp/rs-bin/RocketSizer-Linux.tar.gz -C /tmp/rs-bin
          chmod +x /tmp/rs-bin/RocketSizer-Linux
          uv run --no-project --with playwright --with pillow python -m playwright install --with-deps chromium
          uv run --no-project --with playwright --with pillow python scripts/capture_screenshots.py --binary /tmp/rs-bin/RocketSizer-Linux --out-dir /tmp/rs-shots
          uv run --no-project --with pillow python "${{ runner.temp }}/_aitools/scripts/capture_screenshots.py" --sync-dir /tmp/rs-shots assets/screenshots --threshold 2.0
          if [ -n "$(git status --porcelain assets/screenshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/screenshots
            git commit -m "chore(screenshots): refresh app screenshots [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
